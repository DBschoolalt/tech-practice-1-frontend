<div class = "storepage">
	<h1>Store Page</h1>
	<p>Welcome to our coffee store! Add desired items to your cart by clicking on the "Add To Cart" button</p>
	<input type="text" [(ngModel)]="searchTerm" value="" (input)="filterItems(searchTerm)" placeholder="Look for specific item..">
 	<div *ngFor="let i of filteredItems"> <app-store-page-item [item]=i/> </div>
</div>
